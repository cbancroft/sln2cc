# Starting point, not a finished pipeline — see docs/engineering_spec.md.
name: CI

on:
  push:
  pull_request:

jobs:
  # The crate builds anywhere, so lint and test on Linux where runners are cheapest.
  # Toolchain discovery is mocked in this environment.
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test

  # Windows is the only real runtime target, so confirm it at least builds and runs there.
  rust-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build
      - run: cargo test

  # Nothing else pins a toolchain, so without this the declared MSRV could drift upward
  # unnoticed the first time someone uses a newer language feature.
  #
  # The version must match `rust-version` in cli/Cargo.toml. Raising it there without
  # updating it here fails loudly — cargo refuses to build a manifest that demands a newer
  # toolchain than the one installed — so the duplication is self-correcting in the
  # direction that matters.
  #
  # `cargo check` rather than clippy or test: the question is whether the code compiles on
  # 1.85, and lint output legitimately varies between versions. `--locked` makes the answer
  # deterministic by testing exactly the dependency versions we ship, and fails if the
  # lockfile is stale. `--all-targets` covers test code, which can regress MSRV too.
  rust-msrv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo check --all-targets --locked

  nvim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
      - name: Install mini.test
        run: git clone --depth 1 https://github.com/nvim-mini/mini.test /tmp/mini.test
      - name: Run tests
        working-directory: nvim
        env:
          MINI_TEST_DIR: /tmp/mini.test
        run: |
          nvim --headless --noplugin -u tests/minimal_init.lua \
            -c "lua require('mini.test').setup()" \
            -c "lua MiniTest.run()"

  # Neovim's built-in `vim.pack.add()` clones a git ref and adds exactly that clone's root to
  # runtimepath — there's no subdirectory option, so `main` (where nvim/ sits beside cli/) can
  # never be a vim.pack target directly. This job projects nvim/'s current contents onto a
  # dedicated `nvim-plugin` branch, whose root *is* what a `vim.pack` install needs. See
  # docs/adr/54-nvim-pack-subtree-branch.md for the full reasoning.
  #
  # Gated on `nvim` passing, so a broken plugin never reaches the branch users install from.
  # Only runs on pushes to main that actually touch nvim/, to avoid force-pushing an unchanged
  # branch on every unrelated cli/-only commit.
  publish-nvim-plugin:
    needs: nvim
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether nvim/ changed in this push
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # BEFORE is all-zeros on a branch's first push (or a force-push with no common
          # ancestor available) — treat that as "changed" rather than diffing against a commit
          # that doesn't exist.
          if [ -z "${BEFORE//0/}" ] || ! git diff --quiet "$BEFORE" "${{ github.sha }}" -- nvim/; then
            echo "nvim_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "nvim_changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Split nvim/ onto nvim-plugin and force-push
        if: steps.changed.outputs.nvim_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix=nvim -b nvim-plugin
          git push origin nvim-plugin --force
